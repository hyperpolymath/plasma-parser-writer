# SPDX-License-Identifier: MPL-2.0
name: Track latest cicd-suite gates

# Weekly: is any cicd-suite reusable this repository calls behind
# cicd-suite's main? If so, open a PR that moves every such pin — the estate
# audit, Rust CI, the Creusot, SPARK and miniKanren gates — to cicd-suite
# HEAD. The PR's own gate runs are the check: merge it when they are green.
# Nothing reaches main unreviewed.
#
# The file keeps its original name (track-estate-audit.yml) so repositories
# that already carry it receive this version in place.
#
# ⚠ NO `uses:` ANYWHERE, DELIBERATELY: actions.lock is keyed by workflow path,
# and this must run even when the lock is stale.
#
# Token: AUTOMATION_TOKEN, a fine-grained token on this repository with
# Contents, Pull requests and Workflows set to read/write. In practice it is
# required: the bump edits files under .github/workflows/, which
# GITHUB_TOKEN may not write, and a PR opened by GITHUB_TOKEN does not trigger
# the gate runs that validate it.

on:
  schedule:
    - cron: "23 7 * * 1"   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-estate-audit
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      BRANCH: ci/track-estate-audit
      BOT_EMAIL: 41898583+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Move every cicd-suite pin to HEAD and open a PR
        run: |
          set -euo pipefail
          gh auth setup-git
          base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)
          gh repo clone "$GITHUB_REPOSITORY" repo -- --quiet --depth 1 --branch "$base"
          cd repo

          # Every caller of a cicd-suite reusable, with the SHA it pins.
          mapfile -t callers < <(grep -lE 'uses:[[:space:]]*hyperpolymath/cicd-suite/\.github/workflows/[A-Za-z0-9_.-]+\.yml@[0-9a-f]{40}' .github/workflows/*.yml 2>/dev/null || true)
          if [ "${#callers[@]}" -eq 0 ]; then
            echo "::error::no workflow here calls a cicd-suite reusable at a full SHA."
            exit 1
          fi
          head=$(git ls-remote https://github.com/hyperpolymath/cicd-suite.git HEAD | cut -f1)
          changed=0
          for caller in "${callers[@]}"; do
            while IFS= read -r pinned; do
              [ -n "$pinned" ] || continue
              if [ "$pinned" = "$head" ]; then
                echo "$caller: already at cicd-suite HEAD ${head:0:7}"
                continue
              fi
              echo "$caller: ${pinned:0:7} -> ${head:0:7}"
              sed -i "s/$pinned/$head/g" "$caller"
              changed=1
            done < <(grep -oE 'cicd-suite/\.github/workflows/[A-Za-z0-9_.-]+\.yml@[0-9a-f]{40}' "$caller" | sed 's/.*@//' | sort -u)
          done
          if [ "$changed" -eq 0 ]; then
            echo "Every cicd-suite pin is at HEAD."
            exit 0
          fi

          # The bot branch is rebuilt from the default branch each run, which
          # would discard anything else on it. If someone has pushed to it
          # (say, a fix the newer gate needed), leave it for review.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            foreign=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$BRANCH" \
                        --jq "[.commits[] | select(.commit.author.email != \"$BOT_EMAIL\")] | length")
            if [ "$foreign" != 0 ]; then
              echo "::warning::$BRANCH carries $foreign commit(s) not made by this workflow; leaving it alone. Merge its PR or delete the branch, then re-run."
              exit 0
            fi
          fi

          git switch --quiet -c "$BRANCH"
          git -c user.name='github-actions[bot]' -c user.email="$BOT_EMAIL" \
              commit --quiet -am "ci(cicd-suite): track cicd-suite ${head:0:7}"
          if ! git push --quiet --force origin "$BRANCH"; then
            echo "::error::Push refused: writing under .github/workflows/ needs the AUTOMATION_TOKEN secret described above."
            exit 1
          fi
          body="Moves every cicd-suite reusable this repository calls to cicd-suite \`${head:0:7}\`: https://github.com/hyperpolymath/cicd-suite/commit/$head. This PR's own gate runs are the check. Opened by \`track-estate-audit.yml\`."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "ci(cicd-suite): track cicd-suite ${head:0:7}" --body "$body"
          else
            gh pr create --base "$base" --head "$BRANCH" \
              --title "ci(cicd-suite): track cicd-suite ${head:0:7}" --body "$body"
          fi

# SPDX-License-Identifier: MPL-2.0
# Rust CI — thin caller of the estate's strict Rust gate, which lives in
# hyperpolymath/cicd-suite as a reusable workflow. Do not copy its jobs in
# here: a copy freezes at one cicd-suite commit and never receives a fix.
#
# The job id MUST stay `rust-ci`: the contexts `rust-ci / Cargo check +
# clippy + fmt` and `rust-ci / Cargo test` are what branch rules already
# require, and `rust-ci / Rust CI verdict` is the one context to require
# from now on (red if any gate failed OR was skipped while expected).
#
# The pin is a full SHA, advanced by track-estate-audit.yml (a PR whose own
# run of this gate is the check). Never `@main` or a tag: the account
# enforces sha_pinning_required and a moving ref would change the gate in
# every repository at once.
#
# ⚠ DE-ONBOARDED from actions.lock, deliberately, like the estate-audit
# caller: an onboarded cross-repo reusable startup-fails with zero jobs
# under sha_pinning_required. cicd-suite/scripts/deonboard-workflow.sh
# reverses a re-onboarding.
#
# No `secrets:` line: the reusable consumes none.
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/cicd-suite/.github/workflows/rust-ci.yml@bf7dd95cf49733019343ff485c2f45c6b261839c # cicd-suite main
    # Inputs (all optional; defaults are the strict ones):
    #   working_directory: crates/cli   # sub-crate / monorepo
    #   toolchain: "1.85.0"             # default "auto": rust-toolchain.toml, else stable
    #   enable_coverage: true           # with coverage_floor: "70"
    #   zig_version: "0.15.2"           # crates with a Zig-native build

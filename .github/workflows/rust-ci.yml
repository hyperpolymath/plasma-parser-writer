# SPDX-License-Identifier: MPL-2.0
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  actions: read
  contents: read
# Pin must be at or past the standards commit that passes `toolchain: stable`
# to the SHA-pinned dtolnay/rust-toolchain. d135b05b predates that and fails
# every run with "'toolchain' is a required input" (#105).
jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@95de3dfc3fcf09a1cf3325ab42723e3d81682b45
